        .difficulty-selector {
    margin: 15px 0;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.difficulty-btn {
    margin: 0;
    padding: 16px 24px;
    width: 200px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.difficulty-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
}

.difficulty-btn:hover::before {
    left: 100%;
}

.difficulty-btn:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
}

.difficulty-btn.selected {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}

/* 简单难度样式 */
#easyBtn {
    background: linear-gradient(135deg, #48bb78, #68d391);
    color: white;
    border: 2px solid #38a169;
}

#easyBtn:hover {
    background: linear-gradient(135deg, #38a169, #48bb78);
    box-shadow: 0 8px 25px rgba(72, 187, 120, 0.3);
}

#easyBtn.selected {
    background: linear-gradient(135deg, #2f855a, #38a169);
    border-color: #2f855a;
    box-shadow: 0 6px 20px rgba(72, 187, 120, 0.4);
}

/* 中等难度样式 */
#mediumBtn {
    background: linear-gradient(135deg, #ed8936, #f6ad55);
    color: white;
    border: 2px solid #dd6b20;
}

#mediumBtn:hover {
    background: linear-gradient(135deg, #dd6b20, #ed8936);
    box-shadow: 0 8px 25px rgba(237, 137, 54, 0.3);
}

#mediumBtn.selected {
    background: linear-gradient(135deg, #c05621, #dd6b20);
    border-color: #c05621;
    box-shadow: 0 6px 20px rgba(237, 137, 54, 0.4);
}

/* 困难难度样式 */
#hardBtn {
    background: linear-gradient(135deg, #e53e3e, #fc8181);
    color: white;
    border: 2px solid #c53030;
}

#hardBtn:hover {
    background: linear-gradient(135deg, #c53030, #e53e3e);
    box-shadow: 0 8px 25px rgba(229, 62, 62, 0.3);
}

#hardBtn.selected {
    background: linear-gradient(135deg, #9b2c2c, #c53030);
    border-color: #9b2c2c;
    box-shadow: 0 6px 20px rgba(229, 62, 62, 0.4);
}

/* 添加图标 */
.difficulty-btn::after {
    content: '';
    display: inline-block;
    margin-left: 10px;
    font-size: 16px;
    transition: transform 0.3s;
}

#easyBtn::after {
    content: '😊';
}

#mediumBtn::after {
    content: '😐';
}

#hardBtn::after {
    content: '😰';
}

.difficulty-btn.selected::after {
    transform: scale(1.2);
}

/* 响应式调整 */
@media (max-width: 600px) {
    .difficulty-btn {
        width: 90%;
        max-width: 250px;
        padding: 14px 20px;
        font-size: 16px;
    }
}

   <script>       // 显示提示消息
function showToast(message, type = 'success') {
    // 创建toast元素
    const toast = document.createElement('div');
    toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg z-50 transition-all duration-300 translate-y-[-100px] opacity-0`;
    
    // 设置样式
    if (type === 'success') {
        toast.classList.add('bg-green-500', 'text-white');
    } else {
        toast.classList.add('bg-red-500', 'text-white');
    }
    
    // 设置内容
    toast.textContent = message;
    
    // 添加到页面
    document.body.appendChild(toast);
    
    // 显示toast - 从上方滑入
    setTimeout(() => {
        toast.classList.remove('translate-y-[-100px]', 'opacity-0');

        // 提交答案 单选
        function submitAnswer(answer, btn, isTimeout = false) {
    if (!questions || currentQuestionIndex >= questions.length) {
        return;
    }
    
    const question = questions[currentQuestionIndex];
    if (question.answered || question.type === 'multi') {
        return; // 多选题有专门的提交函数
    }
    
    question.answered = true;

    // 禁用所有选项按钮（单选题）
    document.querySelectorAll('.option-btn').forEach(button => {
        button.disabled = true;
        const optionKey = button.textContent.split('.')[0];
        if (optionKey === question.answer) {
            button.classList.add('correct');
        } else if (button === btn && !isTimeout) {
            button.classList.add('incorrect');
        }
    });

    const startTime = question.startTime || Date.now();
    const timeTaken = Math.floor(Date.now() - startTime);
    const answerTimeEl = document.getElementById('answerTime');
    
    clearInterval(answerTimer);
    answerTimeEl.textContent = '';

    // 计算得分
    const isCorrect = !isTimeout && answer === question.answer;
    const score = isCorrect 
        ? calculateScore(timeTaken, question.difficulty)
        : 0;

    // 发送答题进度
    if (ws) {
        ws.send(JSON.stringify({
            type: 'answer_progress',
            battleId,
            questionIndex: currentQuestionIndex,
            answer: isTimeout ? 'timeout' : answer,
            timeTaken,
            score
        }));
    }

    // 更新当前得分
    const myScoreEl = document.getElementById('myScore');
    myScoreEl.textContent = parseInt(myScoreEl.textContent) + score;

    // 显示答题结果提示
    const countdownEl = document.getElementById('countdown');
    if (isCorrect) {
        countdownEl.textContent = `回答正确！用时${(timeTaken/1000).toFixed(1)}秒，获得${score}分`;
        countdownEl.style.color = '#48bb78';
    } else if (isTimeout) {
        countdownEl.textContent = `答题超时！正确答案：${question.answer}`;
        countdownEl.style.color = '#e53e3e';
    } else {
        countdownEl.textContent = `回答错误！正确答案：${question.answer}`;
        countdownEl.style.color = '#e53e3e';
    }

    // 进入下一题
    setTimeout(() => {
        countdownEl.textContent = '';
        currentQuestionIndex++;
        showCurrentQuestion();
    }, 1500);
}
// 计算得分
function calculateScore(timeTaken, difficulty) {
    const config = DIFFICULTY_TIME_CONFIG[difficulty] || DIFFICULTY_TIME_CONFIG.medium;
    const { baseScore, maxTime, minTime } = config;
    
    if (timeTaken <= minTime) return baseScore;
    if (timeTaken >= maxTime) return Math.round(baseScore * 0.3);
    
    return Math.round(
        baseScore - (baseScore * 0.7) * (timeTaken - minTime) / (maxTime - minTime)
    );
}

    document.querySelector('.submit-multi-btn').disabled = true;

    const startTime = question.startTime || Date.now();
    const timeTaken = Math.floor(Date.now() - startTime);
    const answerTimeEl = document.getElementById('answerTime');
    
    clearInterval(answerTimer);
    answerTimeEl.textContent = '';

    // 计算得分
    const isCorrect = selectedAnswers === question.answer;
    const score = isCorrect 
        ? calculateMultiChoiceScore(timeTaken, question.difficulty, selectedAnswers.length)
        : 0;

    // 发送答题进度
    if (ws) {
        ws.send(JSON.stringify({
            type: 'answer_progress',
            battleId,
            questionIndex: currentQuestionIndex,
            answer: selectedAnswers,
            timeTaken,
            score
        }));
    }

    // 更新当前得分
    const myScoreEl = document.getElementById('myScore');
    myScoreEl.textContent = parseInt(myScoreEl.textContent) + score;

    // 显示答题结果提示
    const countdownEl = document.getElementById('countdown');
    if (isCorrect) {
        countdownEl.textContent = `回答正确！用时${(timeTaken/1000).toFixed(1)}秒，获得${score}分`;
        countdownEl.style.color = '#48bb78';
    } else {
        countdownEl.textContent = `回答错误！正确答案：${question.answer}`;
        countdownEl.style.color = '#e53e3e';
    }

    // 高亮显示正确和错误选项
    highlightMultiChoiceAnswers(question.answer, selectedAnswers);

    // 进入下一题
    setTimeout(() => {
        countdownEl.textContent = '';
        currentQuestionIndex++;
        showCurrentQuestion();
    }, 2000);
}

// 计算多选题得分
function calculateMultiChoiceScore(timeTaken, difficulty, selectedCount) {
    const config = DIFFICULTY_TIME_CONFIG[difficulty] || DIFFICULTY_TIME_CONFIG.medium;
    const { baseScore, maxTime, minTime } = config;
    
    // 多选题基础分数比单选题高
    const multiBaseScore = baseScore * 1.5;
    
    if (timeTaken <= minTime) return Math.round(multiBaseScore);
    if (timeTaken >= maxTime) return Math.round(multiBaseScore * 0.3);
    
    return Math.round(
        multiBaseScore - (multiBaseScore * 0.7) * (timeTaken - minTime) / (maxTime - minTime)
    );
}

// 高亮显示多选题答案
function highlightMultiChoiceAnswers(correctAnswer, userAnswer) {
    const correctOptions = correctAnswer.split('');
    const userOptions = userAnswer.split('');
    
    document.querySelectorAll('.multi-option-label').forEach(label => {
        const checkbox = label.querySelector('input');
        const optionKey = checkbox.value;
        const optionText = label.querySelector('.option-text');
        
        if (correctOptions.includes(optionKey)) {
            // 正确选项
            optionText.style.color = '#48bb78';
            optionText.style.fontWeight = 'bold';
        } else if (userOptions.includes(optionKey) && !correctOptions.includes(optionKey)) {
            // 用户选错了的选项
            optionText.style.color = '#e53e3e';
            optionText.style.textDecoration = 'line-through';
        }
    });
}

// 处理超时
function handleTimeout() {
    const question = questions[currentQuestionIndex];
    if (question.answered) return;
    
    if (question.type === 'multi') {
        // 多选题超时，自动提交当前选中的答案
        const selectedCheckboxes = document.querySelectorAll('input[name="multiOption"]:checked');
        if (selectedCheckboxes.length > 0) {
            submitMultiAnswer();
        } else {
            // 没有选择任何选项，提交空答案
            submitAnswer('', null, true);
        }
    } else {
        submitAnswer('', null, true);
    }
}

            }
        }

        // 发送聊天消息
        async function sendChatMessage() {
            if (!currentChatFriend) {
                showToast('请先选择聊天好友','error');
                return;
            }
            
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            
            if (!content) {
                showToast('请输入消息内容','error');
                return;
            }
            
            // 通过 WebSocket 发送消息
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'chat_message',
                    toUserId: currentChatFriend.id,
                    content: content
                }));
                
                input.value = '';
            } else {
                showToast('连接已断开，请刷新页面','error');
            }
            await loadChatMessages(currentChatFriend.id);// 发送后刷新聊天记录 包含自己的消息
        }

        // 添加消息到聊天界面
        function addMessageToChat(message, isNew = true) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            
            const isOwn = message.from === currentUser.id;
            messageDiv.className = `chat-message ${isOwn ? 'own' : 'other'}`;
            
            const time = new Date(message.timestamp).toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            messageDiv.innerHTML = `
                <div>${message.content}</div>
                <div class="message-time">${time}</div>
            `;
            
            chatMessages.appendChild(messageDiv);
            
            if (isNew) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // 维持心跳连接
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'heartbeat' }));
            }
        }, 30000);

        // 页面加载完成后初始化
        window.onload = async () => {
            console.log('页面加载完成，开始初始化...');
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    console.log('找到已登录用户:', currentUser.username);
                    await updateUserInfo();
                    showModule('gameModule');
                    initWebSocket();
                } catch (e) {
                    console.error('恢复登录状态失败:', e);
                    localStorage.removeItem('currentUser');
                    showModule('loginModule');
                }
            } else {
                console.log('没有找到登录用户，显示登录界面');
                showModule('loginModule');
            }
            console.log('初始化完成');
        };
    </script>
</body>
</html>
